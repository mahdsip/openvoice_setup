monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.suspend-on-idle = false
        node.always-process = true
      }
    }
  },
  {
    matches = [ { node.name = "~alsa_input.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.suspend-on-idle = false
        node.always-process = true
        node.latency = 256/48000
      }
    }
  }
]
