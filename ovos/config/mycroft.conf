      }
    },
    "wake_word": "hey_tiki",
    "multiplier": 1.5,
    "patience": 0.5,
    "speech_begin": 0.2,
    "recording_timeout_with_silence": 8
  },
  "hotwords": {
    "hey_mycroft": {
      "module": "ovos-ww-plugin-openwakeword",
      "sensitivity": 0.95,
      "trigger_level": 1,
      "listen": true,
      "active": false
    },
    "hey_tiki": {
      "module": "ovos-ww-plugin-vosk",
      "model": "/home/__OVOS_USER__/.local/share/vosk/vosk-model-small-es-0.3",
      "samples": [
        "hey tiki",
        "ey tiki",
        "hey ti qui",
        "ey ti qui",
        "tiki"
      ],
      "rule": "contains",
      "time_between_checks": 2.0,
      "lang": "es-es",
      "listen": true,
      "active": true,
      "sound": "snd/start_listening.wav"
    }
  },
  "skills": {
    "installer": {
      "allow_pip": true,
      "allow_alphas": true
    },
    "blacklisted_skills": [
      "ovos-skill-wolfie.openvoiceos",
      "ovos-skill-youtube-music.openvoiceos"
    ]
  },
  "intents": {
